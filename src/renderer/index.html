<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Audio Shrink</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Audio Shrink</h1>

    <div id="drop" class="drop">
      <p id="dropLabel">Drop an MP3 here, or <button type="button" id="chooseBtn" class="link">choose a file</button></p>
      <p id="fileInfo" class="file-info hidden"></p>
    </div>

    <label class="field">
      <span>Maximum size (MB)</span>
      <input type="number" id="maxMB" min="0.1" step="0.1" value="10" />
    </label>

    <label class="check">
      <input type="checkbox" id="normalise" checked />
      <span>Normalise audio</span>
    </label>

    <label class="check">
      <input type="checkbox" id="denoise" />
      <span>Remove white noise</span>
    </label>

    <label class="field sub hidden" id="strengthField">
      <span>Noise removal strength</span>
      <select id="denoiseStrength">
        <option value="light">Light</option>
        <option value="medium" selected>Medium</option>
        <option value="strong">Strong</option>
      </select>
    </label>

    <button type="button" id="startBtn" disabled>Start</button>

    <div id="progressWrap" class="progress-wrap hidden">
      <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
      <p id="statusText" class="status"></p>
    </div>

    <div id="result" class="result hidden">
      <p id="resultText"></p>
      <button type="button" id="revealBtn" class="link">Show in folder</button>
    </div>
    <p id="error" class="error hidden"></p>

    <p id="updateStatus" class="update-status hidden"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
