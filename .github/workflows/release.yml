name: Release

# Build and publish installers when you push a version tag (e.g. v0.1.0).
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish
        run: npm run release
        env:
          # Provided automatically by GitHub Actions — lets electron-builder
          # create the Release and upload the installers + update metadata.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS code signing + notarisation (required for mac auto-update) ---
          # Developer ID Application certificate, exported as a .p12 and base64-encoded:
          #   base64 -i cert.p12 | pbcopy   ->  paste into the MAC_CSC_LINK secret
          #   (scoped to the macOS runner so the cert isn't applied to Windows signing)
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          # Notarisation credentials (used by electron-builder via notarytool):
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
