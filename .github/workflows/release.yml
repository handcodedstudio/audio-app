name: Release

# Build and publish installers when you push a version tag (e.g. v0.1.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for electron-builder to create the GitHub Release

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish
        run: npm run release
        env:
          # Provided automatically by GitHub Actions — lets electron-builder
          # create the Release and upload the installers + update metadata.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Unsigned release ---
          # No Apple keys yet, so force electron-builder to skip code signing.
          # Passing an empty CSC_LINK instead makes it try to sign with a bogus
          # cert path and fail ("not a file"), so we must omit it entirely.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          #
          # --- To enable signed + notarised macOS builds later ---
          # Add the five repo secrets, remove the line above, and uncomment:
          #   CSC_LINK: ${{ secrets.MAC_CSC_LINK }}             # base64 of your .p12
          #   CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
